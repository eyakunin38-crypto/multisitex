    <style>
        /* ----- общие сбросы и шрифты ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #faf8f6;
            color: #1e1e1e;
        }

        /* ----- шапка (header) ----- */
        .header {
            background: #ffffff;
            padding: 18px 0 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .logo__big-text h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            color: #1e1e1e;
        }

        .logo__big-text .white.letter-block {
            color: #b8956e;
            font-weight: 300;
        }

        .logo__additional_inf h3 {
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 0;
            color: #7a6a5a;
        }

        .logo__additional_inf p {
            font-size: 0.9rem;
            color: #9b8a7a;
            margin: 0;
            font-weight: 400;
        }

        .contact {
            text-align: right;
            padding-top: 4px;
        }

        .contact span {
            display: block;
            font-size: 0.8rem;
            color: #7a7a7a;
            letter-spacing: 0.02em;
        }

        .contact .telephone-number {
            display: inline-block;
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e1e1e;
            text-decoration: none;
            margin: 6px 0 4px;
            transition: color 0.2s;
        }

        .contact .telephone-number:hover {
            color: #b8956e;
        }

        /* ----- основной блок .main (фон и центрирование) ----- */
        .main {
            height: 85vh;
            min-height: 600px;
            background: linear-gradient(rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.45)), url('{Image}') center center / cover no-repeat;
            display: flex;
            align-items: center;
        }

        .main .container,
        .main .row {
            height: 100%;
        }

        /* ----- левая часть с текстом "ваша наценка" ----- */
        .main__content h2 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #1e1e1e;
            margin: 0;
        }

        .main__content h2 .red {
            color: #c73b3b;
            font-weight: 800;
            display: inline-block;
            border-bottom: 4px solid #c73b3b;
            padding-bottom: 2px;
        }

        .main__content p {
            font-size: 1.3rem;
            font-weight: 400;
            color: #2c2c2c;
            margin-top: 18px;
            letter-spacing: 0.02em;
        }

        /* ----- форма (карточка) ----- */
        .main__form {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .form {
            background: #ffffff;
            padding: 34px 32px 40px;
            border-radius: 28px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.08), 0 6px 16px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(2px);
            transition: transform 0.2s ease;
        }

        .form:hover {
            transform: translateY(-3px);
        }

        .form h2 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 2px;
            color: #1e1e1e;
        }

        .form .stroke {
            display: inline-block;
            font-size: 1rem;
            font-weight: 400;
            color: #6b5b4b;
            margin-bottom: 4px;
            border-bottom: 2px dashed #d4c5b8;
            padding-bottom: 2px;
        }

        .form p {
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #b8956e;
            margin: 6px 0 20px;
        }

        .form label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #4a3f37;
            margin-bottom: 2px;
            display: block;
            letter-spacing: 0.02em;
        }

        .form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid #e5ddd6;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #fcfaf8;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #1e1e1e;
        }

        .form input:focus {
            border-color: #b8956e;
            box-shadow: 0 0 0 4px rgba(184, 149, 110, 0.15);
            background: #ffffff;
        }

        .form input::placeholder {
            color: #b2a392;
            font-weight: 300;
        }

        .form button {
            width: 100%;
            padding: 14px 20px;
            background: #1e1e1e;
            border: none;
            border-radius: 60px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 6px;
            transition: background 0.25s, transform 0.15s;
            cursor: pointer;
        }

        .form button:hover {
            background: #b8956e;
            transform: scale(1.01);
        }

        .form button:active {
            transform: scale(0.97);
        }

        /* ----- адаптивность (планшеты / телефоны) ----- */
        @media (max-width: 992px) {
            .contact {
                text-align: left;
                margin-top: 10px;
            }

            .contact .telephone-number {
                font-size: 1.3rem;
            }

            .main__content h2 {
                font-size: 2.8rem;
            }

            .form {
                padding: 28px 24px 32px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 14px 0 12px;
            }

            .logo__big-text h1 {
                font-size: 1.8rem;
            }

            .logo__additional_inf h3 {
                font-size: 0.85rem;
            }

            .main {
                height: auto;
                min-height: 100vh;
                padding: 40px 0 60px;
                background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.6)), url('{Image}') center center / cover no-repeat;
            }

            .main__content {
                text-align: center;
                margin-bottom: 28px;
            }

            .main__content h2 {
                font-size: 2.4rem;
            }

            .main__content p {
                font-size: 1.1rem;
            }

            .main__form {
                max-width: 100%;
                padding: 0 12px;
            }

            .form {
                padding: 28px 18px 32px;
                border-radius: 22px;
            }

            .form h2 {
                font-size: 1.4rem;
            }

            .contact .telephone-number {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .logo__big-text h1 {
                font-size: 1.5rem;
            }

            .main__content h2 {
                font-size: 2rem;
            }

            .form button {
                font-size: 0.85rem;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ======== ШАПКА ======== -->
    <header class="header">
        <div class="container">
            <div class="row d-flex justify-content-between align-items-center">
                <div class="col-12 col-lg-7">
                    <div class="logo">
                        <div class="row align-items-center">
                            <div class="col-12 col-md">
                                <div class="logo__big-text">
                                    <h1>Katrin<span class="white letter-block">style</span></h1>
                                </div>
                            </div>
                            <div class="col-12 col-md">
                                <div class="logo__additional_inf">
                                    <h3>оптовый магазин</h3>
                                    <p>женской дизайнерской одежды</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-4">
                    <div class="contact">
                        <span>Звоните на бесплатную горячую линию</span>
                        <a class="telephone-number" href="tel:{Phone}">{Phone}</a>
                        <span>С 9:00 до 21:00 без выходных</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ======== ОСНОВНОЙ БЛОК ======== -->
    <section class="main">
        <div class="container h-100">
            <div class="row h-100 d-flex justify-content-around align-items-center">
                <div class="col-12 col-lg-3 d-flex align-items-center justify-content-center">
                    <div class="main__content">
                        <h2>
                            ваша<br />
                            наценка<br />
                            <span class="red">от 200%</span>
                        </h2>
                        <p>на одежде<br /> высокого качества</p>
                    </div>
                </div>
                <div class="col-12 col-lg-4 d-flex align-items-center justify-content-center">
                    <div class="main__form">
                        <div class="form">
                            <h2>ОСТАВЬТЕ ЗАЯВКУ</h2>
                            <span class="stroke">и получите</span>
                            <p>ОПТОВЫЕ ЦЕНЫ ПРЯМО СЕЙЧАС</p>
                            <form id="nsomedialog-form" action="send.php" method="post">
                                <input id="zaya" type="hidden" name="zaya" value="" />
                                <input type="hidden" name="region" value="{Region}" />
                                <input type="hidden" name="header" value="{Header}" />
                                <input type="hidden" name="keyword" value="{Keyword}" />
                                <input type="hidden" name="source" value="{1st}" />
                                <input type="hidden" name="codeheader" value="{Codeheader}" />

                                <label for="">Введите ваше имя</label>
                                <input type="text" name="name" placeholder="Ваше Имя" required />

                                <label for="">Введите ваш номер телефона</label>
                                <input id="dphone" type="text" name="phone" placeholder="Ваш телефон" required />

                                <label for="">Введите ваш e-mail</label>
                                <input type="text" name="email" placeholder="Ваш e-mail" required />

                                <button type="submit">получите оптовые цены</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
